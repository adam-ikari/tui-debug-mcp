[project]
name = "tui-debug-mcp"
version = "0.1.0"
description = "MCP server for debugging TUI and REPL applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
tui-debug-mcp = "tui_debug_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"